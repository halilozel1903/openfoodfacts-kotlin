<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A17"/>
      <stop offset="1" stop-color="#1F4D2B"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7FBF2"/>
      <stop offset="1" stop-color="#ECF0E6"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B3A1E"/>
      <stop offset="1" stop-color="#8E5530"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1100" cy="90" r="220" fill="#2F6B3A" opacity="0.35"/>
  <circle cx="860" cy="640" r="180" fill="#2F6B3A" opacity="0.25"/>

  <!-- Title and description -->
  <text x="80" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF">openfoodfacts-kotlin</text>
  <text x="80" y="256" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#C9E8CC">Kotlin client for the Open Food Facts API,</text>
  <text x="80" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#C9E8CC">with a Compose barcode scanner app</text>

  <!-- Feature chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F2A17">
    <rect x="80" y="340" width="226" height="42" rx="21" fill="#B4F1B6"/>
    <text x="193" y="367" text-anchor="middle">Product by barcode</text>
    <rect x="318" y="340" width="152" height="42" rx="21" fill="#B4F1B6"/>
    <text x="394" y="367" text-anchor="middle">Nutri-Score</text>
    <rect x="482" y="340" width="78" height="42" rx="21" fill="#B4F1B6"/>
    <text x="521" y="367" text-anchor="middle">NOVA</text>
    <rect x="80" y="394" width="152" height="42" rx="21" fill="#FFDDB8"/>
    <text x="156" y="421" text-anchor="middle">Green-Score</text>
    <rect x="244" y="394" width="131" height="42" rx="21" fill="#FFDDB8"/>
    <text x="310" y="421" text-anchor="middle">Allergens</text>
    <rect x="387" y="394" width="152" height="42" rx="21" fill="#FFDDB8"/>
    <text x="463" y="421" text-anchor="middle">Ingredients</text>
    <rect x="80" y="448" width="99" height="42" rx="21" fill="#E6EDE1"/>
    <text x="130" y="475" text-anchor="middle">Search</text>
    <rect x="191" y="448" width="152" height="42" rx="21" fill="#E6EDE1"/>
    <text x="267" y="475" text-anchor="middle">Rate limits</text>
    <rect x="355" y="448" width="205" height="42" rx="21" fill="#E6EDE1"/>
    <text x="458" y="475" text-anchor="middle">CameraX + ML Kit</text>
  </g>
  <text x="80" y="560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#8FBF95">Android · Kotlin/JVM · Ktor · kotlinx.serialization · Jetpack Compose</text>

  <!-- Phone -->
  <g filter="url(#shadow)">
    <rect x="790" y="56" width="300" height="560" rx="44" fill="#0A0F0B"/>
    <rect x="804" y="70" width="272" height="532" rx="34" fill="url(#screen)"/>
  </g>
  <rect x="912" y="80" width="56" height="10" rx="5" fill="#0A0F0B"/>

  <!-- Product header: an abstract jar -->
  <rect x="822" y="106" width="96" height="112" rx="14" fill="#FFFFFF"/>
  <rect x="846" y="118" width="48" height="16" rx="4" fill="#E9E9E9"/>
  <path d="M842 138 h56 a6 6 0 0 1 6 6 v58 a10 10 0 0 1 -10 10 h-48 a10 10 0 0 1 -10 -10 v-58 a6 6 0 0 1 6 -6z" fill="url(#jar)"/>
  <rect x="846" y="160" width="48" height="24" rx="6" fill="#F4F1EA"/>
  <circle cx="870" cy="172" r="7" fill="#C8102E" opacity="0.85"/>
  <rect x="932" y="118" width="120" height="16" rx="8" fill="#181D17"/>
  <rect x="932" y="144" width="84" height="12" rx="6" fill="#72796F"/>
  <rect x="932" y="164" width="56" height="12" rx="6" fill="#C2C9BD"/>

  <!-- Nutri-Score strip -->
  <rect x="822" y="234" width="236" height="74" rx="14" fill="#E6EAE1"/>
  <rect x="836" y="256" width="36" height="38" rx="0" fill="#038141" opacity="0.55"/>
  <rect x="872" y="256" width="36" height="38" fill="#85BB2F" opacity="0.55"/>
  <rect x="908" y="256" width="36" height="38" fill="#FECB02" opacity="0.55"/>
  <rect x="944" y="256" width="36" height="38" fill="#EE8100" opacity="0.55"/>
  <rect x="984" y="246" width="56" height="56" rx="12" fill="#E63E11" stroke="#FFFFFF" stroke-width="4"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-weight="900" fill="#FFFFFF" text-anchor="middle">
    <text x="854" y="282" font-size="18">A</text>
    <text x="890" y="282" font-size="18">B</text>
    <text x="926" y="282" font-size="18">C</text>
    <text x="962" y="282" font-size="18">D</text>
    <text x="1012" y="285" font-size="30">E</text>
  </g>

  <!-- Nutrition table rows -->
  <rect x="822" y="324" width="236" height="172" rx="14" fill="#E6EAE1"/>
  <g fill="#72796F">
    <rect x="838" y="342" width="90" height="12" rx="6" fill="#181D17"/>
    <rect x="838" y="372" width="70" height="10" rx="5"/><rect x="1004" y="372" width="40" height="10" rx="5"/>
    <rect x="852" y="396" width="86" height="10" rx="5"/><rect x="1004" y="396" width="40" height="10" rx="5"/>
    <rect x="838" y="420" width="96" height="10" rx="5"/><rect x="1004" y="420" width="40" height="10" rx="5"/>
    <rect x="852" y="444" width="60" height="10" rx="5"/><rect x="1004" y="444" width="40" height="10" rx="5"/>
    <rect x="838" y="468" width="76" height="10" rx="5"/><rect x="1004" y="468" width="40" height="10" rx="5"/>
  </g>
  
  <!-- Allergen pills -->
  <rect x="822" y="512" width="64" height="28" rx="14" fill="#FFDDB8"/>
  <rect x="894" y="512" width="72" height="28" rx="14" fill="#FFDDB8"/>
  <rect x="974" y="512" width="56" height="28" rx="14" fill="#FFDDB8"/>
  <rect x="822" y="552" width="236" height="30" rx="15" fill="#2F6B3A" opacity="0.15"/>

  <!-- Barcode being scanned -->
  <g transform="translate(1110 380) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="96" rx="12" fill="#FFFFFF"/>
    <g fill="#181D17">
      <rect x="14" y="14" width="5" height="58"/><rect x="23" y="14" width="2" height="58"/>
      <rect x="29" y="14" width="6" height="58"/><rect x="39" y="14" width="3" height="58"/>
      <rect x="46" y="14" width="2" height="58"/><rect x="52" y="14" width="7" height="58"/>
      <rect x="63" y="14" width="3" height="58"/><rect x="70" y="14" width="5" height="58"/>
      <rect x="79" y="14" width="2" height="58"/><rect x="85" y="14" width="6" height="58"/>
      <rect x="95" y="14" width="3" height="58"/><rect x="102" y="14" width="5" height="58"/>
      <rect x="111" y="14" width="2" height="58"/><rect x="117" y="14" width="8" height="58"/>
    </g>
    <rect x="10" y="78" width="120" height="8" rx="4" fill="#C2C9BD"/>
    <rect x="6" y="40" width="128" height="4" rx="2" fill="#E63E11" opacity="0.9"/>
  </g>
</svg>
